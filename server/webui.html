<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonsai-27B · Thor</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --fg:#e6e9ef; --dim:#8b93a3;
    --accent:#7cc6a6; --user:#2b3442; --think:#1b2029; --code:#11151c;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f8fa;--panel:#fff;--line:#e2e5ea;--fg:#1a1d23;--dim:#666d7a;
          --accent:#1f7a54;--user:#e8edf5;--think:#f0f2f6;--code:#f2f4f7}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;height:100vh}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header b{color:var(--accent)}
  .meta{color:var(--dim);font-size:12px}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:860px;width:100%;margin:0 auto}
  .role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
        margin-bottom:4px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;
          padding:11px 14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .user .bubble{background:var(--user)}
  details.think{margin-bottom:8px;background:var(--think);border:1px solid var(--line);
                border-radius:8px;padding:7px 11px}
  details.think summary{cursor:pointer;color:var(--dim);font-size:12px;user-select:none}
  details.think div{white-space:pre-wrap;color:var(--dim);font-size:13px;margin-top:7px;
                    max-height:340px;overflow:auto}
  pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:11px;
      overflow-x:auto;margin:9px 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:11px 16px}
  .row{max-width:860px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);
           border-radius:9px;padding:10px 12px;font:inherit;max-height:180px}
  button{background:var(--accent);color:#04140d;border:0;border-radius:9px;padding:10px 17px;
         font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .opts{max-width:860px;margin:8px auto 0;display:flex;gap:16px;flex-wrap:wrap;
        color:var(--dim);font-size:12px;align-items:center}
  .opts input[type=number]{width:74px;background:var(--bg);color:var(--fg);
        border:1px solid var(--line);border-radius:6px;padding:3px 6px}
  .stat{color:var(--dim);font-size:11px;margin-top:5px}
</style>
</head>
<body>
<header>
  <b>Bonsai-27B</b>
  <span class="meta" id="hdr">connecting…</span>
  <span style="flex:1"></span>
  <button id="clear" style="background:transparent;color:var(--dim);border:1px solid var(--line)">
    new chat</button>
</header>

<div id="log"></div>

<footer>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Message Bonsai…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="think" checked> thinking</label>
    <label>temp <input type="number" id="temp" value="0.7" step="0.1" min="0" max="2"></label>
    <label>max tokens <input type="number" id="max" value="768" step="64" min="16"></label>
    <span id="policy"></span>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let history = [];
let busy = false;

fetch('/v1/policy').then(r=>r.json()).then(p=>{
  $('#hdr').textContent = `${p.variant} · ${p.backend}` +
     (p.speculation ? ' · DSpark' : '') + (p.deterministic ? ' · deterministic' : '');
  $('#policy').textContent = p.reasons && p.reasons.length ? '· ' + p.reasons.length + ' policy notes (see /v1/policy)' : '';
}).catch(()=>{ $('#hdr').textContent = 'offline'; });

// Minimal, dependency-free markdown: fenced code blocks + inline code.
// Everything else stays literal so model output is never silently mangled.
function render(text){
  const out = document.createDocumentFragment();
  const parts = text.split(/```/);
  parts.forEach((part,i)=>{
    if(i % 2 === 1){
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = part.replace(/^[a-zA-Z0-9+-]*\n/,'');
      pre.appendChild(code); out.appendChild(pre);
    } else if(part){
      const span = document.createElement('span');
      span.textContent = part;
      out.appendChild(span);
    }
  });
  return out;
}

function addMsg(role){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const r = document.createElement('div');
  r.className = 'role'; r.textContent = role === 'user' ? 'you' : 'bonsai';
  const b = document.createElement('div'); b.className = 'bubble';
  wrap.append(r,b); log.appendChild(wrap); log.scrollTop = log.scrollHeight;
  return b;
}

async function send(){
  const text = $('#input').value.trim();
  if(!text || busy) return;
  busy = true; $('#send').disabled = true;
  $('#input').value = ''; $('#input').style.height='auto';

  addMsg('user').textContent = text;
  history.push({role:'user', content:text});

  const bubble = addMsg('assistant');
  let think = null, thinkBody = null, contentSpan = null;
  let answer = '', nTok = 0;
  const t0 = performance.now();
  const stat = document.createElement('div'); stat.className = 'stat';
  bubble.parentElement.appendChild(stat);

  try{
    const res = await fetch('/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: history, stream: true,
        temperature: parseFloat($('#temp').value),
        max_tokens: parseInt($('#max').value),
        enable_thinking: $('#think').checked,
      })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const line = buf.slice(0,i).trim(); buf = buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if(payload === '[DONE]') continue;
        let j; try{ j = JSON.parse(payload); }catch{ continue; }
        const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
        if(d.reasoning_content){
          if(!think){
            think = document.createElement('details');
            think.className = 'think'; think.open = true;
            const s = document.createElement('summary'); s.textContent = 'thinking…';
            thinkBody = document.createElement('div');
            think.append(s, thinkBody);
            bubble.appendChild(think);
          }
          thinkBody.textContent += d.reasoning_content;
          thinkBody.scrollTop = thinkBody.scrollHeight;
        }
        if(d.content){
          if(think && think.open){ think.open = false;
            think.querySelector('summary').textContent = 'thinking (done)'; }
          answer += d.content; nTok++;
          if(!contentSpan){ contentSpan = document.createElement('div');
            bubble.appendChild(contentSpan); }
          contentSpan.textContent = '';
          contentSpan.appendChild(render(answer));
        }
        if(j.bonsai && j.bonsai.decode_tok_s){
          stat.textContent = `${j.bonsai.decode_tok_s.toFixed(1)} tok/s · ` +
            `TTFT ${j.bonsai.ttft_s.toFixed(2)}s · ${j.bonsai.cached_tokens} cached`;
        }
        log.scrollTop = log.scrollHeight;
      }
    }
    if(!stat.textContent){
      const dt = (performance.now()-t0)/1000;
      stat.textContent = `${(nTok/dt).toFixed(1)} tok/s`;
    }
    history.push({role:'assistant', content:answer});
  }catch(e){
    bubble.textContent = 'error: ' + e.message;
  }finally{
    busy = false; $('#send').disabled = false; $('#input').focus();
  }
}

$('#send').onclick = send;
$('#clear').onclick = ()=>{ history = []; log.innerHTML = ''; };
$('#input').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('#input').addEventListener('input', function(){
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight,180)+'px';
});
$('#input').focus();
</script>
</body>
</html>
